name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_ENV: "local"
  APP_DEBUG: true
  APP_KEY: ${{ secrets.APP_KEY }}
  APP_NAME: "Laravel API Template"
  LOG_CHANNEL: "stack"
  DB_HOST: "0.0.0.0"
  DB_PORT: "5432"
  DB_DATABASE: "laravel_template"
  DB_USERNAME: "admin"
  DB_PASSWORD: "password"

jobs:
  code-quality:
    name: Code style validation and code static analysis
    runs-on: ubuntu-latest
    env:
      CACHE_DRIVER: file
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version-file: .php-version
          extensions: pdo, pdo_mysql, pcntl, intl, zip, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer
        run: composer validate

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Run Pint To Validate Code Style
        run: composer pint-test

      - name: Run PHPStan To Analyse The Code
        run: composer phpstan

      - name: Run Pest Type Coverage
        run: composer type-coverage
  test:
    name: Run tests (pinned PHP)
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build patched PostgreSQL image
        run: docker build --pull --no-cache -t laravel-api-template-postgres:17.12 -f .docker/postgres/Dockerfile .

      - name: Start PostgreSQL
        run: |
          docker run --detach --name laravel-template-postgres \
            --publish 5432:5432 \
            --env POSTGRES_DB=laravel_template \
            --env POSTGRES_USER=admin \
            --env POSTGRES_PASSWORD=password \
            --env POSTGRES_HOST_AUTH_METHOD=md5 \
            --health-cmd 'pg_isready -U admin -d laravel_template' \
            --health-interval 2s --health-timeout 5s --health-retries 15 \
            laravel-api-template-postgres:17.12

          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' laravel-template-postgres)
            if [[ "$status" == 'healthy' ]]; then
              exit 0
            fi
            if [[ "$status" == 'unhealthy' ]]; then
              break
            fi
            sleep 2
          done

          docker logs laravel-template-postgres
          exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version-file: .php-version
          extensions: pdo, pdo_pgsql, pcntl, intl, zip, bcmath
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Prepare Database
        run: php artisan migrate --seed

      - name: Cache config for bootstrapping
        run: php artisan config:cache

      - name: Run test suite
        run: composer test-coverage-ci

      - name: Run mutation tests
        run: composer test-mutate

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Add Code Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
          header: 'Code Coverage Summary'

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: code-coverage-results.md
